[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-subscription-analytics"
version = "1.0.0"
description = "Streamlit dashboard for telecom customer churn prediction and subscription analytics"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["app", "data_manager", "ml_engine", "visualizer"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
